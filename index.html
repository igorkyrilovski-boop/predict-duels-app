<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Duels Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 97vh;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 10px 14px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .balance-container {
            font-size: 16px;
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 3px;
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 6px;
            font-size: 11px;
            color: #cbd5e1;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 4px;
        }

        .stats-item span {
            font-weight: bold;
            color: #fff;
        }

        .pair-container {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .pair-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            padding: 4px;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .pair-btn.active {
            background: #3b82f6;
            color: white;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .price-text {
            font-size: 20px;
            font-weight: bold;
            color: #4eef90;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .zoom-group {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 6px;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        #price-canvas {
            width: 100%;
            height: 140px;
            display: block;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            z-index: 1000;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .close-btn {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        #modal-canvas {
            width: 100%;
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .buttons-container {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
            box-sizing: border-box;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .bet-btn {
            background-color: #e2e8f0;
            color: #1e293b;
            font-size: 12px;
            padding: 6px 2px;
            flex: 1;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .bet-btn.active {
            background-color: #f39c12;
            color: white;
        }

        .btn-up {
            background-color: #2ecc71;
            color: white;
        }

        .btn-down {
            background-color: #e74c3c;
            color: white;
        }

        .status {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="balance-container">💰 Баланс: <span id="balance">1000</span> монет</div>
        <div class="stats-grid">
            <div class="stats-item">Матчей: <span id="stat-total">0</span></div>
            <div class="stats-item">Побед: <span id="stat-wins">0</span></div>
            <div class="stats-item">Поражений: <span id="stat-losses">0</span></div>
            <div class="stats-item">Winrate: <span id="stat-winrate">0%</span></div>
        </div>
    </div>

    <div class="card">
        <div class="pair-container">
            <button class="pair-btn active" onclick="changePair('BTCUSDT', 'BTC / USDT')">BTC</button>
            <button class="pair-btn" onclick="changePair('ETHUSDT', 'ETH / USDT')">ETH</button>
            <button class="pair-btn" onclick="changePair('SOLUSDT', 'SOL / USDT')">SOL</button>
        </div>
        <div class="header-row">
            <span style="font-weight: bold; font-size: 14px;" id="pair-title">BTC / USDT</span>
            <div class="price-text" id="btc-price">$--,---.--</div>
        </div>
        
        <div class="chart-header">
            <div class="zoom-group">
                <button class="action-btn" onclick="zoomIn()">🔍+</button>
                <button class="action-btn" onclick="zoomOut()">🔍-</button>
            </div>
            <button class="action-btn" onclick="openModalChart()">📊 На весь экран</button>
        </div>
        
        <canvas id="price-canvas"></canvas>
        <div class="status" id="status">Подключение к бирже...</div>
    </div>

    <!-- Полноэкранное модальное окно -->
    <div class="modal" id="chart-modal">
        <div class="modal-header">
            <div>
                <h3 style="margin: 0; color: #fff;" id="modal-pair-title">BTC / USDT</h3>
                <div style="color: #4eef90; font-size: 18px; font-weight: bold;" id="modal-btc-price">$--,---.--</div>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="action-btn" onclick="zoomModalIn()">🔍+</button>
                <button class="action-btn" onclick="zoomModalOut()">🔍-</button>
                <button class="close-btn" onclick="closeModalChart()">✕</button>
            </div>
        </div>
        <canvas id="modal-canvas"></canvas>
    </div>

    <div class="card" id="game-card">
        <p id="game-instruction" style="margin: 0 0 4px 0; font-size: 13px;">Сумма ставки и прогноз на <b>60 секунд</b>:</p>
        
        <div class="buttons-container" id="bet-selection">
            <button class="bet-btn" onclick="setBet(50)">50</button>
            <button class="bet-btn active" onclick="setBet(100)">100</button>
            <button class="bet-btn" onclick="setBet(250)">250</button>
            <button class="bet-btn" onclick="setBet(500)">500</button>
        </div>

        <div class="buttons-container" id="buttons-block" style="margin-top: 6px;">
            <button class="btn btn-up" onclick="makeBet('UP')">🚀 ВЫРАСТЕТ</button>
            <button class="btn btn-down" onclick="makeBet('DOWN')">📉 УПАДЕТ</button>
        </div>
        <div class="status" id="timer-status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let currentBet = 100;
        let isPlaying = false;
        let currentSymbol = 'BTCUSDT';
        let currentPairName = 'BTC / USDT';
        let currentPrice = 0;
        let candles = [];
        let priceInterval = null;

        // Параметры масштаба (количество видимых свечей на экране)
        let visibleCandlesMain = 20;
        let visibleCandlesModal = 40;

        let stats = { total: 0, wins: 0, losses: 0 };

        const canvas = document.getElementById('price-canvas');
        const ctx = canvas.getContext('2d');

        const modalCanvas = document.getElementById('modal-canvas');
        const modalCtx = modalCanvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 28;
            canvas.height = 140;

            if (document.getElementById('chart-modal').classList.contains('active')) {
                modalCanvas.width = modalCanvas.parentElement.clientWidth - 30;
                modalCanvas.height = modalCanvas.parentElement.clientHeight - 80;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function zoomIn() {
            if (visibleCandlesMain > 8) {
                visibleCandlesMain -= 4;
                drawAllCharts();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function zoomOut() {
            if (visibleCandlesMain < 50) {
                visibleCandlesMain += 4;
                drawAllCharts();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function zoomModalIn() {
            if (visibleCandlesModal > 12) {
                visibleCandlesModal -= 8;
                drawAllCharts();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function zoomModalOut() {
            if (visibleCandlesModal < 90) {
                visibleCandlesModal += 8;
                drawAllCharts();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function drawCandlesOnContext(cContext, cCanvas, maxCandles) {
            cContext.clearRect(0, 0, cCanvas.width, cCanvas.height);
            if (candles.length === 0) return;

            let displayCandles = candles.slice(-maxCandles);

            let prices = [];
            displayCandles.forEach(c => prices.push(c.high, c.low));
            let min = Math.min(...prices);
            let max = Math.max(...prices);
            let range = max - min || 1;

            let candleWidth = Math.max(3, cCanvas.width / displayCandles.length - 4);

            displayCandles.forEach((c, i) => {
                let x = i * (cCanvas.width / displayCandles.length) + candleWidth / 2;
                
                let yHigh = cCanvas.height - ((c.high - min) / range) * (cCanvas.height - 30) - 15;
                let yLow = cCanvas.height - ((c.low - min) / range) * (cCanvas.height - 30) - 15;
                let yOpen = cCanvas.height - ((c.open - min) / range) * (cCanvas.height - 30) - 15;
                let yClose = cCanvas.height - ((c.close - min) / range) * (cCanvas.height - 30) - 15;

                let isGreen = c.close >= c.open;
                let color = isGreen ? '#2ecc71' : '#e74c3c';

                cContext.beginPath();
                cContext.strokeStyle = color;
                cContext.lineWidth = 1.5;
                cContext.moveTo(x, yHigh);
                cContext.lineTo(x, yLow);
                cContext.stroke();

                let bodyY = Math.min(yOpen, yClose);
                let bodyHeight = Math.max(Math.abs(yOpen - yClose), 2);

                cContext.fillStyle = color;
                cContext.fillRect(x - candleWidth / 2, bodyY, candleWidth, bodyHeight);
            });
        }

        function drawAllCharts() {
            drawCandlesOnContext(ctx, canvas, visibleCandlesMain);
            if (document.getElementById('chart-modal').classList.contains('active')) {
                drawCandlesOnContext(modalCtx, modalCanvas, visibleCandlesModal);
            }
        }

        function openModalChart() {
            document.getElementById('modal-pair-title').innerText = currentPairName;
            document.getElementById('chart-modal').classList.add('active');
            resizeCanvas();
            drawAllCharts();
            tg.HapticFeedback.impactOccurred('light');
        }

        function closeModalChart() {
            document.getElementById('chart-modal').classList.remove('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        tg.CloudStorage.getItem('user_balance', (err, value) => {
            if (!err && value) balance = parseInt(value);
            else tg.CloudStorage.setItem('user_balance', '1000');
            updateUI();
        });

        tg.CloudStorage.getItem('user_stats', (err, value) => {
            if (!err && value) {
                try { stats = JSON.parse(value); } catch(e) {}
            }
            updateUI();
        });

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-wins').innerText = stats.wins;
            document.getElementById('stat-losses').innerText = stats.losses;
            let winrate = stats.total > 0 ? Math.round((stats.wins / stats.total) * 100) : 0;
            document.getElementById('stat-winrate').innerText = winrate + '%';
        }

        function setBet(amount) {
            if (isPlaying) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.innerText) === amount) btn.classList.add('active');
            });
            tg.HapticFeedback.selectionChanged();
        }

        function changePair(symbol, pairName) {
            if (isPlaying) return;
            currentSymbol = symbol;
            currentPairName = pairName;
            document.getElementById('pair-title').innerText = pairName;

            document.querySelectorAll('.pair-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === symbol.replace('USDT', '')) {
                    btn.classList.add('active');
                }
            });

            candles = [];
            fetchPrice();
            tg.HapticFeedback.selectionChanged();
        }

        function fetchPrice() {
            const priceEl = document.getElementById('btc-price');
            const modalPriceEl = document.getElementById('modal-btc-price');
            const statusEl = document.getElementById('status');

            fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentSymbol}`)
                .then(res => res.json())
                .then(data => {
                    let price = parseFloat(data.price);
                    currentPrice = price;
                    let formatted = `$${currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                    priceEl.innerText = formatted;
                    modalPriceEl.innerText = formatted;
                    statusEl.innerText = "🟢 Терминал активен";

                    if (candles.length === 0 || candles[candles.length - 1].closed) {
                        candles.push({ open: price, high: price, low: price, close: price, closed: false });
                        if (candles.length > 80) candles.shift();
                    } else {
                        let currentCandle = candles[candles.length - 1];
                        currentCandle.close = price;
                        if (price > currentCandle.high) currentCandle.high = price;
                        if (price < currentCandle.low) currentCandle.low = price;
                    }

                    if (!window.candleTimer) {
                        window.candleTimer = setInterval(() => {
                            if (candles.length > 0) {
                                candles[candles.length - 1].closed = true;
                            }
                        }, 3000);
                    }

                    drawAllCharts();
                })
                .catch(err => {
                    statusEl.innerText = "⚠️ Ошибка связи с биржей";
                });
        }

        fetchPrice();
        priceInterval = setInterval(fetchPrice, 1200);

        function makeBet(direction) {
            if (isPlaying) return;
            if (balance < currentBet) {
                alert("Недостаточно монет на балансе!");
                return;
            }

            tg.HapticFeedback.impactOccurred('medium');
            balance -= currentBet;
            updateUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());

            isPlaying = true;
            const startPrice = currentPrice;
            
            document.getElementById('bet-selection').style.display = 'none';
            document.querySelector('.pair-container').style.display = 'none';
            document.getElementById('buttons-block').style.display = 'flex';
            
            const timerStatus = document.getElementById('timer-status');
            const instruction = document.getElementById('game-instruction');
            
            instruction.innerHTML = `Пара: <b>${currentPairName}</b> | Ставка: <b>${currentBet}</b><br>Прогноз: <b>${direction === 'UP' ? '🚀 ВЫРАСТЕТ' : '📉 УПАДЕТ'}</b> ($${startPrice.toFixed(2)})`;

            let timeLeft = 60;
            timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

            const interval = setInterval(() => {
                timeLeft--;
                timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    finishGame(startPrice, direction);
                }
            }, 1000);
        }

        function finishGame(startPrice, direction) {
            const endPrice = currentPrice;
            let won = false;

            if (direction === 'UP' && endPrice > startPrice) won = true;
            if (direction === 'DOWN' && endPrice < startPrice) won = true;

            stats.total++;
            const instruction = document.getElementById('game-instruction');
            const timerStatus = document.getElementById('timer-status');

            if (won) {
                stats.wins++;
                const prize = currentBet * 2;
                balance += prize;
                instruction.innerHTML = `🎉 ПОБЕДА! (${currentPairName}) Цена: $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💰 Вы выиграли <b>+${prize} монет</b>!`;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                stats.losses++;
                instruction.innerHTML = `❌ ПРОИГРЫШ. (${currentPairName}) Цена: $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💸 Вы потеряли ${currentBet} монет.`;
                tg.HapticFeedback.notificationOccurred('error');
            }

            updateUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());
            tg.CloudStorage.setItem('user_stats', JSON.stringify(stats));

            setTimeout(() => {
                window.location.href = `https://t.me/predict_duels_game_bot?start=balance_${balance}`;
            }, 2500);
        }
    </script>
</body>
</html>
