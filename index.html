<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Duels Mini App</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 90vh;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #4eef90;
            margin: 15px 0;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-up {
            background-color: #2ecc71;
            color: white;
        }

        .btn-down {
            background-color: #e74c3c;
            color: white;
        }

        .status {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚔️ Арена Дуэлей</h2>
        <p>Пара: <b>BTC / USDT</b></p>
        <div class="price" id="btc-price">$ --,---.--</div>
        <div class="status" id="status">Подключение к бирже...</div>
    </div>

    <div class="card">
        <p>Сделай прогноз на <b>60 секунд</b>:</p>
        <div class="buttons-container">
            <button class="btn btn-up" onclick="makeBet('UP')">🚀 ВЫРАСТЕТ</button>
            <button class="btn btn-down" onclick="makeBet('DOWN')">📉 УПАДЕТ</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получение живой цены BTC с Binance напрямую через браузер
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        const priceEl = document.getElementById('btc-price');
        const statusEl = document.getElementById('status');

        ws.onopen = () => {
            statusEl.innerText = "🟢 Рынок в реальном времени";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const price = parseFloat(data.p).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            priceEl.innerText = `$${price}`;
        };

        function makeBet(direction) {
            tg.HapticFeedback.impactOccurred('medium'); // Виброотклик в телефоне
            alert(`Ставка принята! Прогноз: ${direction}`);
        }
    </script>
</body>
</html>
