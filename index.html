<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Duels Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 96vh;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 16px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .balance-container {
            font-size: 17px;
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 4px;
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 8px;
            font-size: 12px;
            color: #cbd5e1;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }

        .stats-item span {
            font-weight: bold;
            color: #fff;
        }

        .pair-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .pair-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            padding: 6px;
            color: #aaa;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .pair-btn.active {
            background: #3b82f6;
            color: white;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            color: #4eef90;
            margin: 6px 0;
        }

        .buttons-container {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .bet-btn {
            background-color: #e2e8f0;
            color: #1e293b;
            font-size: 13px;
            padding: 6px 4px;
            flex: 1;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .bet-btn.active {
            background-color: #f39c12;
            color: white;
        }

        .btn-up {
            background-color: #2ecc71;
            color: white;
            font-size: 16px;
        }

        .btn-down {
            background-color: #e74c3c;
            color: white;
            font-size: 16px;
        }

        .status {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="balance-container">💰 Баланс: <span id="balance">1000</span> монет</div>
        <div class="stats-grid">
            <div class="stats-item">Матчей: <span id="stat-total">0</span></div>
            <div class="stats-item">Побед: <span id="stat-wins">0</span></div>
            <div class="stats-item">Поражений: <span id="stat-losses">0</span></div>
            <div class="stats-item">Winrate: <span id="stat-winrate">0%</span></div>
        </div>
    </div>

    <div class="card">
        <div class="pair-container">
            <button class="pair-btn active" onclick="changePair('btcusdt', 'BTC / USDT')">BTC</button>
            <button class="pair-btn" onclick="changePair('ethusdt', 'ETH / USDT')">ETH</button>
            <button class="pair-btn" onclick="changePair('solusdt', 'SOL / USDT')">SOL</button>
        </div>
        <h2 style="margin: 2px 0; font-size: 18px;">⚔️ <span id="pair-title">BTC / USDT</span></h2>
        <div class="price" id="btc-price">$ --,---.--</div>
        <div class="status" id="status">Подключение к бирже...</div>
    </div>

    <div class="card" id="game-card">
        <p id="game-instruction" style="margin: 0 0 6px 0; font-size: 14px;">Ставка и прогноз на <b>60 секунд</b>:</p>
        
        <!-- Выбор суммы ставки -->
        <div class="buttons-container" id="bet-selection">
            <button class="bet-btn" onclick="setBet(50)">50</button>
            <button class="bet-btn active" onclick="setBet(100)">100</button>
            <button class="bet-btn" onclick="setBet(250)">250</button>
            <button class="bet-btn" onclick="setBet(500)">500</button>
        </div>

        <div class="buttons-container" id="buttons-block" style="margin-top: 8px;">
            <button class="btn btn-up" onclick="makeBet('UP')">🚀 ВЫРАСТЕТ</button>
            <button class="btn btn-down" onclick="makeBet('DOWN')">📉 УПАДЕТ</button>
        </div>
        <div class="status" id="timer-status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let currentBet = 100;
        let isPlaying = false;
        let currentSymbol = 'btcusdt';
        let currentPairName = 'BTC / USDT';
        let ws = null;
        let currentPrice = 0;

        let stats = { total: 0, wins: 0, losses: 0 };

        tg.CloudStorage.getItem('user_balance', (err, value) => {
            if (!err && value) balance = parseInt(value);
            else tg.CloudStorage.setItem('user_balance', '1000');
            updateUI();
        });

        tg.CloudStorage.getItem('user_stats', (err, value) => {
            if (!err && value) {
                try { stats = JSON.parse(value); } catch(e) {}
            }
            updateUI();
        });

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-wins').innerText = stats.wins;
            document.getElementById('stat-losses').innerText = stats.losses;
            let winrate = stats.total > 0 ? Math.round((stats.wins / stats.total) * 100) : 0;
            document.getElementById('stat-winrate').innerText = winrate + '%';
        }

        function setBet(amount) {
            if (isPlaying) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.innerText) === amount) btn.classList.add('active');
            });
            tg.HapticFeedback.selectionChanged();
        }

        function changePair(symbol, pairName) {
            if (isPlaying) return;
            currentSymbol = symbol;
            currentPairName = pairName;
            document.getElementById('pair-title').innerText = pairName;

            document.querySelectorAll('.pair-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(symbol.replace('usdt', '').toUpperCase())) {
                    btn.classList.add('active');
                }
            });

            connectWebSocket();
            tg.HapticFeedback.selectionChanged();
        }

        function connectWebSocket() {
            if (ws) ws.close();
            const priceEl = document.getElementById('btc-price');
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Подключение...";

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${currentSymbol}@trade`);

            ws.onopen = () => { statusEl.innerText = "🟢 Рынок в реальном времени"; };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                currentPrice = parseFloat(data.p);
                let decimals = currentSymbol === 'btcusdt' ? 2 : 2;
                priceEl.innerText = `$${currentPrice.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}`;
            };
        }

        connectWebSocket();

        function makeBet(direction) {
            if (isPlaying) return;
            if (balance < currentBet) {
                alert("Недостаточно монет на балансе!");
                return;
            }

            tg.HapticFeedback.impactOccurred('medium');
            balance -= currentBet;
            updateUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());

            isPlaying = true;
            const startPrice = currentPrice;
            
            document.getElementById('bet-selection').style.display = 'none';
            document.querySelector('.pair-container').style.display = 'none';
            document.getElementById('buttons-block').style.display = 'flex';
            
            const timerStatus = document.getElementById('timer-status');
            const instruction = document.getElementById('game-instruction');
            
            instruction.innerHTML = `Пара: <b>${currentPairName}</b> | Ставка: <b>${currentBet}</b><br>Прогноз: <b>${direction === 'UP' ? '🚀 ВЫРАСТЕТ' : '📉 УПАДЕТ'}</b> ($${startPrice.toFixed(2)})`;

            let timeLeft = 60;
            timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

            const interval = setInterval(() => {
                timeLeft--;
                timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    finishGame(startPrice, direction);
                }
            }, 1000);
        }

        function finishGame(startPrice, direction) {
            const endPrice = currentPrice;
            let won = false;

            if (direction === 'UP' && endPrice > startPrice) won = true;
            if (direction === 'DOWN' && endPrice < startPrice) won = true;

            stats.total++;
            const instruction = document.getElementById('game-instruction');
            const timerStatus = document.getElementById('timer-status');

            if (won) {
                stats.wins++;
                const prize = currentBet * 2;
                balance += prize;
                instruction.innerHTML = `🎉 ПОБЕДА! (${currentPairName}) Цена: $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💰 Вы выиграли <b>+${prize} монет</b>!`;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                stats.losses++;
                instruction.innerHTML = `❌ ПРОИГРЫШ. (${currentPairName}) Цена: $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💸 Вы потеряли ${currentBet} монет.`;
                tg.HapticFeedback.notificationOccurred('error');
            }

            updateUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());
            tg.CloudStorage.setItem('user_stats', JSON.stringify(stats));

            setTimeout(() => {
                window.location.href = `https://t.me/predict_duels_game_bot?start=balance_${balance}`;
            }, 2500);
        }
    </script>
</body>
</html>
