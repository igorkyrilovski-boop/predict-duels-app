<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Duels Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 90vh;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .balance-container {
            font-size: 18px;
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 10px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #4eef90;
            margin: 10px 0;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-up {
            background-color: #2ecc71;
            color: white;
        }

        .btn-down {
            background-color: #e74c3c;
            color: white;
        }

        .status {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="balance-container">💰 Баланс: <span id="balance">1000</span> монет</div>
        <h2>⚔️ Арена Дуэлей</h2>
        <p>Пара: <b>BTC / USDT</b></p>
        <div class="price" id="btc-price">$ --,---.--</div>
        <div class="status" id="status">Подключение к бирже...</div>
    </div>

    <div class="card" id="game-card">
        <p id="game-instruction">Сделай прогноз на <b>60 секунд</b> (Ставка: 100 монет):</p>
        <div class="buttons-container" id="buttons-block">
            <button class="btn btn-up" onclick="makeBet('UP')">🚀 ВЫРАСТЕТ</button>
            <button class="btn btn-down" onclick="makeBet('DOWN')">📉 УПАДЕТ</button>
        </div>
        <div class="status" id="timer-status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        const BET_AMOUNT = 100;
        let isPlaying = false;

        // Загружаем баланс из облака Telegram
        tg.CloudStorage.getItem('user_balance', (err, value) => {
            if (!err && value) {
                balance = parseInt(value);
            } else {
                // Если первый раз, сохраняем 1000
                tg.CloudStorage.setItem('user_balance', '1000');
            }
            updateBalanceUI();
        });

        function updateBalanceUI() {
            document.getElementById('balance').innerText = balance;
        }

        // Подключение к Binance WebSocket для живого курса
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        const priceEl = document.getElementById('btc-price');
        const statusEl = document.getElementById('status');

        let currentPrice = 0;

        ws.onopen = () => {
            statusEl.innerText = "🟢 Рынок в реальном времени";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            currentPrice = parseFloat(data.p);
            const formattedPrice = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            priceEl.innerText = `$${formattedPrice}`;
        };

        function makeBet(direction) {
            if (isPlaying) return;
            if (balance < BET_AMOUNT) {
                alert("Недостаточно монет на балансе!");
                return;
            }

            tg.HapticFeedback.impactOccurred('medium');
            
            // Списываем ставку
            balance -= BET_AMOUNT;
            updateBalanceUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());

            isPlaying = true;
            const startPrice = currentPrice;
            
            document.getElementById('buttons-block').style.display = 'none';
            const timerStatus = document.getElementById('timer-status');
            const instruction = document.getElementById('game-instruction');
            
            instruction.innerHTML = `Прогноз: <b>${direction === 'UP' ? '🚀 ВЫРАСТЕТ' : '📉 УПАДЕТ'}</b><br>Начальная цена: $${startPrice.toFixed(2)}`;

            let timeLeft = 60;
            timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

            const interval = setInterval(() => {
                timeLeft--;
                timerStatus.innerText = `⏳ До окончания дуэли: ${timeLeft} сек.`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    finishGame(startPrice, direction);
                }
            }, 1000);
        }

        function finishGame(startPrice, direction) {
            const endPrice = currentPrice;
            let won = false;

            if (direction === 'UP' && endPrice > startPrice) won = true;
            if (direction === 'DOWN' && endPrice < startPrice) won = true;

            const instruction = document.getElementById('game-instruction');
            const timerStatus = document.getElementById('timer-status');

            if (won) {
                const prize = BET_AMOUNT * 2;
                balance += prize;
                instruction.innerHTML = `🎉 ПОБЕДА! Цена стала $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💰 Вы выиграли <b>+${prize} монет</b>!`;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                instruction.innerHTML = `❌ ПРОИГРЫШ. Цена стала $${endPrice.toFixed(2)}`;
                timerStatus.innerHTML = `💸 Вы потеряли ${BET_AMOUNT} монет.`;
                tg.HapticFeedback.notificationOccurred('error');
            }

            updateBalanceUI();
            tg.CloudStorage.setItem('user_balance', balance.toString());

            // Возвращаем кнопки через 4 секунды
            setTimeout(() => {
                document.getElementById('buttons-block').style.display = 'flex';
                instruction.innerHTML = `Сделай прогноз на <b>60 секунд</b> (Ставка: 100 монет):`;
                timerStatus.innerText = '';
                isPlaying = false;
            }, 4000);
        }
    </script>
</body>
</html>
